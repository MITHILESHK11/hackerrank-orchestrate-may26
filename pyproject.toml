[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "support-triage-cli"
version = "1.0.0"
description = "Multi-domain support triage CLI for HackerRank, Claude, and Visa ticket routing."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy==2.2.6",
  "pandas==2.2.3",
  "python-dotenv==1.0.1",
  "rank-bm25==0.2.2",
  "requests==2.32.3",
  "tqdm==4.67.1"
]

[project.scripts]
triage-cli = "main:main"
triage-eval = "evaluator:main"

[tool.setuptools]
package-dir = {"" = "code"}
py-modules = [
  "agent",
  "classifier",
  "corpus_loader",
  "evaluator",
  "llm_client",
  "main",
  "models",
  "prompt_builder",
  "retriever"
]
